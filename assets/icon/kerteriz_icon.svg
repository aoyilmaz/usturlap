<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="#1e1c14"/>

  <!-- Mesh edges (team links) -->
  <line x1="512" y1="512" x2="310" y2="280" stroke="#4e4832" stroke-width="10" stroke-linecap="round"/>
  <line x1="512" y1="512" x2="714" y2="280" stroke="#4e4832" stroke-width="10" stroke-linecap="round"/>
  <line x1="512" y1="512" x2="310" y2="744" stroke="#4e4832" stroke-width="10" stroke-linecap="round"/>
  <line x1="512" y1="512" x2="714" y2="744" stroke="#4e4832" stroke-width="10" stroke-linecap="round"/>
  <!-- Peer-to-peer edges -->
  <line x1="310" y1="280" x2="714" y2="280" stroke="#4e4832" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <line x1="310" y1="744" x2="714" y2="744" stroke="#4e4832" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <line x1="310" y1="280" x2="310" y2="744" stroke="#4e4832" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
  <line x1="714" y1="280" x2="714" y2="744" stroke="#4e4832" stroke-width="7" stroke-linecap="round" opacity="0.35"/>

  <!-- Cardinal tick marks -->
  <line x1="512" y1="160" x2="512" y2="210" stroke="#645c41" stroke-width="9" stroke-linecap="round"/>
  <line x1="512" y1="814" x2="512" y2="864" stroke="#645c41" stroke-width="9" stroke-linecap="round"/>
  <line x1="160" y1="512" x2="210" y2="512" stroke="#645c41" stroke-width="9" stroke-linecap="round"/>
  <line x1="814" y1="512" x2="864" y2="512" stroke="#645c41" stroke-width="9" stroke-linecap="round"/>

  <!-- Compass needle — north (khaki green) -->
  <polygon points="512,322 470,512 554,512" fill="#9aa056"/>
  <!-- Compass needle — south (dark olive) -->
  <polygon points="512,702 470,512 554,512" fill="#484a28"/>

  <!-- Mesh nodes — outer -->
  <circle cx="310" cy="280" r="38" fill="#808644"/>
  <circle cx="714" cy="280" r="38" fill="#9aa056"/>
  <circle cx="310" cy="744" r="38" fill="#646a34"/>
  <circle cx="714" cy="744" r="38" fill="#808644"/>

  <!-- Center node (self) — ring -->
  <circle cx="512" cy="512" r="34" fill="#1e1c14" stroke="#9aa056" stroke-width="12"/>
</svg>
