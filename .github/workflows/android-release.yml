# Android APK yayını → GitHub Releases.
# Tetik: "v1.0.0" gibi bir etiket push'u (ya da Actions sekmesinden elle).
# "-" içeren etiketler (ör. v1.0.0-rc1) ön sürüm olarak yayınlanır.
#
# Gereken secret'lar (Settings → Secrets and variables → Actions):
#   MAPBOX_ACCESS_TOKEN        Mapbox genel (pk.) yayın anahtarı
#   ANDROID_KEYSTORE_BASE64    usturlap-release.jks dosyasının base64 hâli
#   ANDROID_KEYSTORE_PASSWORD  anahtar deposu parolası
#   ANDROID_KEY_ALIAS          anahtar adı (usturlap)
#   ANDROID_KEY_PASSWORD       anahtar parolası
name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Gizli değerler
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$MAPBOX_ACCESS_TOKEN" || { echo "MAPBOX_ACCESS_TOKEN secret'ı yok"; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret'ı yok"; exit 1; }
          printf '{"MAPBOX_ACCESS_TOKEN": "%s"}' "$MAPBOX_ACCESS_TOKEN" > dart_defines.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/usturlap-release.jks"

      - run: flutter pub get

      # Etiket pubspec sürümüyle aynı olmalı: aynı versionCode'lu APK yeniden
      # yayınlanırsa kurulu uygulamalar güncellenmez.
      - name: Etiket = sürüm
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="${GITHUB_REF_NAME#v}"
          BASE="${TAG%%-*}"
          test "$BASE" = "$VERSION" || { echo "Etiket ($GITHUB_REF_NAME) pubspec sürümüyle ($VERSION) uyuşmuyor"; exit 1; }

      - name: Analiz ve testler
        run: |
          flutter analyze --no-fatal-infos lib test
          flutter test test/

      - name: APK derle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/usturlap-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Mimariye göre ayrı APK'lar: tek APK üç mimariyi taşıyınca ~3 kat büyük.
        run: flutter build apk --release --split-per-abi --dart-define-from-file=dart_defines.json

      - name: Dosyaları hazırla
        id: files
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p dist
          OUT=build/app/outputs/flutter-apk
          # usturlap.apk: günümüz telefonları (64-bit ARM); sitedeki bağlantı buna gider.
          cp "$OUT/app-arm64-v8a-release.apk" dist/usturlap.apk
          cp "$OUT/app-arm64-v8a-release.apk" "dist/usturlap-${VERSION}-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/usturlap-${VERSION}-armeabi-v7a.apk"
          cp "$OUT/app-x86_64-release.apk" "dist/usturlap-${VERSION}-x86_64.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          rm -f dart_defines.json "$RUNNER_TEMP/usturlap-release.jks"

      - name: Releases'e koy
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Usturlap ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            **Android için Usturlap ${{ steps.files.outputs.version }}**

            Kurulum: `usturlap.apk` dosyasını telefona indirip açın. Tarayıcınıza
            "bilinmeyen uygulamaları yükleme" izni vermeniz istenebilir. Ayrıntılı
            anlatım: https://aoyilmaz.github.io/usturlap/#kurulum

            Hangi dosya?
            - `usturlap.apk`: günümüz telefonlarının hepsi (64-bit ARM). Çoğu kişi için bu.
            - `…-armeabi-v7a.apk`: eski, 32-bit telefonlar ("uygulama yüklenmedi" hatası alırsanız).
            - `…-x86_64.apk`: emülatörler ve bazı Chromebook'lar.

            Android 7.0 ve üzeri. Android sürümü şimdilik emülatörde denendi.

            Dosyanın bozulmadığını `SHA256SUMS.txt` ile doğrulayabilirsiniz.

      - name: Elle çalıştırmada APK'yı sakla
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: usturlap-apk
          path: dist/
